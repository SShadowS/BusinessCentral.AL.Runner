# Generated by `kraken onboard generate` from .kraken/intake.yaml. Change the intake and generate again.
schema: 1
name: alrunner
repo: 'https://github.com/SShadowS/BusinessCentral.AL.Runner'
image: .kraken/Dockerfile
ssh_port: 2213 # server1 sshPorts range 2210-2299; alsem 2210, tsal 2211, lethal 2212
mem_limit: 12g
cap_add: [PERFMON] # samply and perf stat need perf_event_open (Docker seccomp allows it only with CAP_PERFMON)
agents:
  - name: orchestrator
    runtime: interactive
    branch: kraken # the fork main is left alone (264 old commits); .kraken lives only here
    model: opus
    session_name: alrunner-orchestrator
    start:
      - /kraken:kraken-join
      - Read .kraken/AGENTS.md now and follow it for all work in this tentacle.
  - name: lane-perf
    runtime: interactive
    branch: lane-perf
    model: opus
    session_name: alrunner-lane-perf
    start:
      - /kraken:kraken-join
      - Read .kraken/AGENTS.md now and follow it for all work in this tentacle.
setup:
  - >-
    git remote get-url upstream >/dev/null 2>&1 || git remote add upstream
    https://github.com/aldevtools/BusinessCentral.AL.Runner.git
  - git fetch upstream main
  - git submodule update --init corpus
  - >-
    if [ "$(git -C corpus rev-parse --is-shallow-repository)" = true ]; then git
    -C corpus fetch --unshallow --quiet; fi
  - >-
    dotnet publish tools/dotnet-sidecar -c Release -o target/dotnet-sidecar
    --disable-build-servers -p:UseSharedCompilation=false -p:AlReadyToRun=true
  - cargo build --release -p al-test-cli
  - >-
    mkdir -p ~/.cache/al-runtime && flock ~/.cache/al-runtime/.fetch.lock
    ./target/release/al-test-cli --root . --all-versions --fetch-deps
    --fetch-render-pieces
reaper:
  grace_minutes: 10
  disposable: []
  protect: []
